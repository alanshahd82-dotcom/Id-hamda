<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>استكشف — My Sindbad</title>
  <meta name="theme-color" content="#0A192F">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/jpeg" href="./icons/brand-logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./utils/navigation.css">
  <link rel="stylesheet" href="./utils/header.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{--navy:#0A192F;--navy2:#243b53;--gold:#D4AF37;--dark:#b8941f;--bg:#fbf9f5;--line:#e8ecf2;--muted:#64748b}
    *{box-sizing:border-box;font-family:Cairo,system-ui,sans-serif}body{margin:0;min-height:100vh;background:#060e1a;color:#0c1624}.shell{width:100%;max-width:480px;min-height:100vh;margin:auto;padding-bottom:calc(86px + env(safe-area-inset-bottom));background:var(--bg);box-shadow:0 0 60px #0005}
    .header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;min-height:76px;padding:calc(14px + env(safe-area-inset-top)) 18px 12px;background:#0a192ff7;border-bottom:1px solid #d4af374d;color:#fff}.brand{display:flex;align-items:center;gap:.7rem;color:#fff;text-decoration:none}.brand img{width:46px;height:46px;border-radius:14px;border:1px solid #d4af3770;object-fit:cover}.brand b{display:block;color:var(--gold);font:700 1.2rem 'Playfair Display',Georgia,serif}.brand small{display:block;color:#fffb;font-size:.65rem}
    .content{padding:18px}.intro p{margin:0;color:var(--dark);font-size:.68rem;font-weight:800}.intro h1{margin:.25rem 0 .2rem;color:var(--navy);font-size:1.45rem;font-weight:800}.intro small{color:var(--muted);font-size:.72rem}
    .weather{position:relative;overflow:hidden;margin:16px 0 12px;padding:16px;border-radius:20px;color:#fff;background:linear-gradient(135deg,#0a192f,#334e68);box-shadow:0 12px 24px #0b1b5130}.weather:after{content:'☼';position:absolute;left:18px;top:8px;color:#d4af3760;font-size:5rem}.weather>*{position:relative;z-index:1}.weather-label{color:#f4d979;font-size:.66rem;font-weight:800}.weather h2{margin:3px 0;font-size:1.08rem}.weather-row{display:flex;align-items:end;gap:12px}.temperature{font-size:2rem;font-weight:800;color:var(--gold)}.weather-text{font-size:.75rem;color:#fffd;margin-bottom:6px}
    .budget{margin-bottom:16px;padding:15px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 8px 22px #0b1b510d}.budget-title{display:flex;justify-content:space-between;align-items:center;color:var(--navy);font-size:.85rem;font-weight:800}.budget-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.budget-grid div{padding:9px 5px;text-align:center;border-radius:11px;background:#f6f8fb}.budget-grid small{display:block;color:var(--muted);font-size:.6rem}.budget-grid b{display:block;margin-top:2px;color:var(--navy);font-size:.76rem}.budget-grid .remaining{color:#15803d}.progress{height:7px;overflow:hidden;border-radius:99px;background:#e8ecf2}.progress i{display:block;height:100%;width:0;border-radius:inherit;background:var(--gold);transition:width .3s ease}
    .tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1;min-height:44px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--muted);cursor:pointer;font-size:.8rem;font-weight:800}.tabs button.active{border-color:var(--gold);background:#fffaf0;color:var(--navy)}.cards{display:grid;gap:12px}.place-card{overflow:hidden;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 8px 20px #0b1b5110}.place-card img{display:block;width:100%;height:150px;object-fit:cover}.place-body{padding:12px}.place-head{display:flex;justify-content:space-between;gap:8px}.place-head h3{margin:0;color:var(--navy);font-size:.9rem}.rating{color:#b17f00;font-size:.7rem;font-weight:800;white-space:nowrap}.place-body p{margin:5px 0 10px;color:var(--muted);font-size:.68rem}.place-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--muted);font-size:.68rem}.price{color:var(--navy);font-size:.82rem;font-weight:800}.add{width:100%;min-height:42px;border:0;border-radius:11px;background:var(--gold);color:var(--navy);cursor:pointer;font-size:.76rem;font-weight:800}.add:hover{background:#e2bd42}.add.done{background:#dcfce7;color:#15803d}.empty{padding:24px;text-align:center;color:var(--muted);font-size:.78rem;background:#fff;border:1px solid var(--line);border-radius:16px}
    .toast{position:fixed;right:50%;bottom:94px;z-index:40;display:none;transform:translateX(50%);padding:11px 16px;border-radius:12px;background:var(--navy);color:#fff;font-size:.75rem;font-weight:700;box-shadow:0 8px 22px #0004}.toast.show{display:block;animation:toast .25s ease both}@keyframes toast{from{opacity:0;transform:translate(50%,8px)}to{opacity:1;transform:translate(50%,0)}}
    .nav{position:fixed;bottom:0;left:50%;z-index:30;display:flex;width:100%;max-width:480px;transform:translateX(-50%);padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#0a192ff7;border-top:1px solid #fff2;box-shadow:0 -4px 18px #0003;backdrop-filter:blur(14px)}.nav a{display:flex;min-height:52px;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:12px;color:#fffa;text-decoration:none;font-size:.6rem}.nav a.active{background:#d4af3729;color:var(--gold);font-weight:800}
    @media(min-width:700px){body{padding:22px 0}.shell{min-height:calc(100vh - 44px);border-radius:28px;overflow:hidden}.nav{position:absolute;border-radius:0 0 28px 28px}}
  </style>
</head>
<body>
<main class="shell">
  <div data-site-header></div>
  <section class="content">
    <div class="intro"><p>MY SINDBAD · اكتشف حولك</p><h1>أماكن تستحق الزيارة</h1><small id="destination-label">وجهتك الحالية</small></div>
      <section class="weather" aria-live="polite"><span class="weather-label">الطقس الآن</span><h2 id="weather-city">الدار البيضاء</h2><div class="weather-row"><strong class="temperature" id="temperature">—</strong><span class="weather-text" id="weather-text">جارٍ تحميل حالة الطقس</span></div><small id="forecast" style="color:#fffb;font-size:.65rem">التوقعات متاحة بعد التحميل</small></section>
      <section class="budget" aria-label="متابعة الميزانية"><div class="budget-title"><span>مراقبة الميزانية</span><span id="budget-percent">0% مستخدم</span></div><div class="budget-grid"><div><small>الميزانية الكلية</small><b id="total-budget">1500 MAD</b></div><div><small>المصروفات المقدرة</small><b id="spent-budget">0 MAD</b></div><div><small>المتبقي</small><b class="remaining" id="left-budget">1500 MAD</b></div></div><div class="progress"><i id="budget-progress"></i></div></section>
    <div class="tabs"><button class="active" data-type="hotels" type="button">فنادق 🏨</button><button data-type="restaurants" type="button">مطاعم 🍽️</button></div>
    <div class="cards" id="cards"></div>
  </section>
  <nav data-site-nav data-active="explore"></nav>
</main>
<div class="toast" id="toast" role="status">تمت الإضافة إلى رحلتك بنجاح!</div>
<script>
const hotelData=[
 {name:'رياض دار النخيل',rating:'4.8',price:420,distance:'2.5 كم',image:'https://images.unsplash.com/photo-1564501049412-61c2a3083791?auto=format&fit=crop&w=900&q=82',desc:'إقامة هادئة بتجربة مغربية أصيلة'},
 {name:'فندق المدينة العتيقة',rating:'4.6',price:590,distance:'3.1 كم',image:'https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=900&q=82',desc:'راحة عصرية بالقرب من أهم المعالم'},
 {name:'دار السفر البوتيكية',rating:'4.7',price:680,distance:'4.2 كم',image:'https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?auto=format&fit=crop&w=900&q=82',desc:'غرف مميزة وإطلالة جميلة على المدينة'}
];
const restaurantData=[
 {name:'مطعم النكهات المحلية',rating:'4.9',price:160,distance:'1.4 كم',image:'https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=900&q=82',desc:'أطباق محلية بمكونات موسمية'},
 {name:'مائدة الرحالة',rating:'4.7',price:120,distance:'2.2 كم',image:'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=900&q=82',desc:'جلسة مريحة ونكهات من كل مكان'},
 {name:'مقهى الشرفة',rating:'4.6',price:75,distance:'3.6 كم',image:'https://images.unsplash.com/photo-1554118811-1e0d58224f24?auto=format&fit=crop&w=900&q=82',desc:'قهوة وحلويات بإطلالة هادئة'}
];
let trip=null,activities=[],type='hotels',total=0,spent=0;
const $=id=>document.getElementById(id);
 function readTrip(){try{trip=JSON.parse(localStorage.getItem('currentTrip')||localStorage.getItem('sb_trip')||'null')}catch(e){trip=null}try{activities=JSON.parse(localStorage.getItem('myTripActivities')||'[]')}catch(e){activities=[]}const budget=trip&&trip.budget?Number(trip.budget.amount):1500;total=Number.isFinite(budget)&&budget>0?budget:1500;const city=trip?.destination||trip?.destinationName||trip?.city||'الدار البيضاء';$('destination-label').textContent=city;$('weather-city').textContent=city;return {city,lat:Number(trip?.lat)||33.5731,lon:Number(trip?.lon)||-7.5898,currency:trip?.budget?.currency||'MAD'}}
  function renderBudget(){const currency=trip?.budget?.currency||'MAD';$('total-budget').textContent=`${total} ${currency}`;$('spent-budget').textContent=`${spent} ${currency}`;const left=Math.max(0,total-spent),percent=Math.min(100,Math.round(spent/total*100));$('left-budget').textContent=`${left} ${currency}`;$('budget-percent').textContent=percent+'% مستخدم';$('budget-progress').style.width=percent+'%'}
  function renderPlaces(placeType){type=placeType;const data=placeType==='hotels'?hotelData:restaurantData;const saved=new Set(activities.map(x=>x.id));$('cards').innerHTML=data.map((p,i)=>{const id=`${placeType}-${i}`,done=saved.has(id);return `<article class="place-card"><img src="${p.image}" alt="${p.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/900x500?text=My+Sindbad'"><div class="place-body"><div class="place-head"><h3>${p.name}</h3><span class="rating">★ ${p.rating}</span></div><p>${p.desc}</p><div class="place-meta"><span>⌖ ${p.distance}</span><span class="price">${p.price} MAD ${placeType==='hotels'?'لليلة':'للفرد'}</span></div><button class="add ${done?'done':''}" data-id="${id}" data-index="${i}" ${done?'disabled':''}>${done?'✓ تمت الإضافة':'أضف إلى رحلتي ➕'}</button></div></article>`}).join('');document.querySelectorAll('.add').forEach(b=>b.addEventListener('click',()=>addPlace(b,data[Number(b.dataset.index)])))}
function addPlace(button,place){const id=button.dataset.id;const item={id,title:place.name,place:place.name,type:type==='hotels'?'فندق':'مطعم',price:place.price,distance:place.distance,addedAt:new Date().toISOString()};if(activities.some((entry)=>entry&&entry.id===id))return;try{activities.push(item);localStorage.setItem('myTripActivities',JSON.stringify(activities))}catch(error){activities=activities.filter((entry)=>entry!==item);$('toast').textContent='تعذر الحفظ. تحقق من مساحة التخزين.';$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2400);return}spent+=place.price;button.textContent='✓ تمت الإضافة';button.classList.add('done');button.disabled=true;renderBudget();$('toast').textContent='تمت الإضافة إلى رحلتك';$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2400)}
function weatherText(code){if(code===0)return'صحو ومشمس';if(code<3)return'غائم جزئياً';if(code<50)return'غائم';if(code<70)return'أمطار';if(code<80)return'زخات مطرية';return'طقس متقلب'}
  async function loadWeather(location){const fallback={city:location.city||'الدار البيضاء',temperature:24,code:0,forecast:'اليوم 24° / 17° · غداً 25° / 18° · بعد غد 23° / 16°'};try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${location.lat}&longitude=${location.lon}&current_weather=true&daily=temperature_2m_max,temperature_2m_min&timezone=auto`);if(!r.ok)throw Error();const d=await r.json(),c=d.current||d.current_weather,code=Number(c?.weather_code??c?.weathercode);if(!c||!Number.isFinite(code)||!d.daily)throw Error();$('temperature').textContent=Math.round(c.temperature_2m)+'°';$('weather-text').textContent=weatherText(code);$('forecast').textContent=`الأيام القادمة: ${d.daily.temperature_2m_min.map((v,i)=>`${Math.round(v)}° / ${Math.round(d.daily.temperature_2m_max[i])}°`).join(' · ')}`}catch(e){$('weather-city').textContent=fallback.city;$('temperature').textContent=fallback.temperature+'°';$('weather-text').textContent='مشمس ☀️';$('forecast').textContent=`توقعات تقريبية: ${fallback.forecast}`}}
const location=readTrip();spent=activities.reduce((sum,a)=>sum+Number(a.price||0),0);renderBudget();renderPlaces('hotels');loadWeather(location);document.querySelectorAll('[data-type]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('active',x===b));renderPlaces(b.dataset.type)}));
</script>
<script src="./utils/navigation.js"></script>
<script src="./utils/header.js"></script>
</body>
</html>
