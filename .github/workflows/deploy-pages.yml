name: نشر واجهة جمعية إحمدا

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: تجهيز ملفات الواجهة
        uses: actions/checkout@v4
      - name: تهيئة GitHub Pages
        uses: actions/configure-pages@v5
      - name: رفع الواجهة
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - name: نشر الواجهة
        id: deployment
        uses: actions/deploy-pages@v4
