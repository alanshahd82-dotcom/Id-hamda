<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Sindbad — رفيق السفر</title>
<meta name="theme-color" content="#0B1B33">
<meta name="application-name" content="My Sindbad">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Sindbad">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/jpeg" href="./icons/brand-logo.jpg">
<link rel="apple-touch-icon" href="./icons/brand-logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          navy: {
            900: '#0A192F',
            800: '#243b53',
            700: '#334e68',
          },
          gold: {
            500: '#D4AF37',
            400: '#ffcc33',
            600: '#b8941f',
          },
        },
      },
    },
  };
</script>
<style>
:root {
  --navy-950: #060e1a;
  --navy-900: #0A192F;
  --navy-800: #243b53;
  --navy-700: #334e68;
  --navy-50: #f4f7fb;
  --gold: #D4AF37;
  --gold-dark: #b8941f;
  --gold-light: rgba(212, 175, 55, 0.12);
  --bg: #fbf9f5;
  --surface: #ffffff;
  --border: #e8ecf2;
  --border-subtle: #f1f4f8;
  --text-main: #0c1624;
  --text-muted: #5e6d82;
  --text-light: #94a3b8;
  --danger: #dc2626;
  --danger-light: #fee2e2;
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 18px;
  --radius-full: 9999px;
  --shadow-sm: 0 1px 3px rgba(11, 27, 51, 0.04);
  --shadow-md: 0 4px 16px rgba(11, 27, 51, 0.06);
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', system-ui, -apple-system, sans-serif; }
html { scroll-behavior: auto; }
*, *::before, *::after { transition: color .18s ease, background-color .18s ease, border-color .18s ease, transform .18s ease; }
body {
  background: #060d1a;
  color: var(--text-main);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  display: flex;
  justify-content: center;
  min-height: 100vh;
  overflow-x: hidden;
}
.hidden { display: none !important; }
.en { font-family: 'Playfair Display', Georgia, serif; }

/* الهيكل الخارجي PWA Shell — Mobile First */
.shell {
  width: 100%;
  max-width: 440px;
  margin: 0 auto;
  min-height: 100dvh;
  background: var(--bg);
  position: relative;
  display: flex;
  flex-direction: column;
  padding-bottom: calc(72px + env(safe-area-inset-bottom));
  box-shadow: 0 0 50px rgba(0, 0, 0, 0.35);
}
@media (max-width: 480px) {
  .shell { box-shadow: none; }
}

.content { padding: 1.1rem 1rem; flex: 1; }

/* حقول الإدخال */
.inp {
  width: 100%;
  min-height: 44px;
  padding: 0.65rem 0.9rem;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  font-size: 0.88rem;
  background: var(--surface);
  color: var(--text-main);
  box-sizing: border-box;
}
.inp:focus {
  outline: none;
  border-color: var(--navy-700);
  box-shadow: 0 0 0 3px rgba(11, 27, 51, 0.06);
}
label {
  display: block;
  font-size: 0.78rem;
  color: var(--text-muted);
  font-weight: 600;
  margin-bottom: 0.75rem;
}
label .inp { margin-top: 0.35rem; }

/* الأزرار */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.45rem;
  min-height: 44px;
  background: var(--navy-800);
  color: #fff;
  border: none;
  border-radius: var(--radius-md);
  padding: 0.65rem 1.2rem;
  font-weight: 600;
  font-size: 0.88rem;
  cursor: pointer;
  font-family: inherit;
  text-decoration: none;
}
.btn:active { transform: none; }
.btn.navy { background: var(--navy-800); color: #fff; }
.btn.navy:hover { background: var(--navy-900); }
.btn.ghost {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-main);
}
.btn.ghost:hover { background: var(--navy-50); border-color: var(--navy-700); }
.btn.sm { min-height: 36px; padding: 0.35rem 0.85rem; font-size: 0.78rem; border-radius: var(--radius-sm); }
.btn.w { width: 100%; }

/* عناوين الأقسام والبطاقات */
.sec {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  color: var(--navy-900);
  font-weight: 700;
  font-size: 0.95rem;
  margin: 1.3rem 0 0.75rem;
}
.sec::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 1rem;
  margin-bottom: 0.85rem;
  box-shadow: var(--shadow-sm);
}

/* بطاقة الحالة الفارغة الراقية */
.empty-state {
  text-align: center;
  padding: 2.2rem 1.2rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  margin: 0.85rem 0;
}
.empty-state .es-icon {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: var(--navy-50);
  color: var(--navy-800);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 0.85rem;
}
.empty-state h3 {
  font-size: 1.02rem;
  color: var(--navy-900);
  font-weight: 700;
  margin-bottom: 0.35rem;
}
.empty-state p {
  font-size: 0.8rem;
  color: var(--text-muted);
  line-height: 1.5;
  margin-bottom: 1.1rem;
}

/* شاشة الدخول */
.auth {
  min-height: 100vh;
  background:
    radial-gradient(circle at 50% -10%, rgba(197,168,128,.22), transparent 34%),
    linear-gradient(180deg, var(--navy-950) 0%, var(--navy-900) 100%);
  color: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2.2rem 1.4rem;
  text-align: center;
}
.auth .logo { width: 76px; height: 76px; margin-bottom: 0.8rem; }
.auth .logo img { width: 100%; height: 100%; display: block; object-fit: cover; border-radius: 22%; }
.auth h1 { font-size: 1.85rem; color: #ffffff; letter-spacing: 0.5px; margin-bottom: 0.15rem; }
.auth .tag { color: var(--gold); font-size: 0.76rem; letter-spacing: .4px; font-weight: 700; margin-bottom: 1.6rem; }
.auth-card {
  background: var(--surface);
  color: var(--text-main);
  border-radius: var(--radius-lg);
  padding: 1.5rem 1.25rem;
  width: 100%;
  max-width: 340px;
  text-align: right;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
}
.auth-card .tabs {
  display: flex;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 3px;
  margin-bottom: 1.1rem;
}
.auth-card .tabs button {
  flex: 1;
  min-height: 38px;
  border: none;
  background: none;
  padding: 0.4rem;
  border-radius: var(--radius-sm);
  font-weight: 600;
  font-size: 0.82rem;
  color: var(--text-muted);
  cursor: pointer;
  font-family: inherit;
}
.auth-card .tabs button.on { background: var(--surface); color: var(--navy-900); font-weight: 700; box-shadow: var(--shadow-sm); }
.auth-card .err { color: var(--danger); font-size: 0.75rem; min-height: 1.2rem; margin: 0.25rem 0; }
.auth-card .free {
  margin-top: 0.9rem;
  background: #f0fdf4;
  color: #15803d;
  border: 1px solid #bbf7d0;
  border-radius: var(--radius-sm);
  padding: 0.45rem;
  font-size: 0.72rem;
  font-weight: 600;
  text-align: center;
}
.auth .feat { display: flex; gap: 0.5rem; margin-top: 1.5rem; flex-wrap: wrap; justify-content: center; }
.auth .feat span {
  border: 1px solid rgba(255, 255, 255, 0.15);
  background: rgba(255, 255, 255, 0.05);
  color: #e2e8f0;
  border-radius: var(--radius-full);
  padding: 0.3rem 0.85rem;
  font-size: 0.7rem;
}

/* الهيدر العلوي */
.hdr {
  background: var(--surface);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border-subtle);
  padding: 0.7rem 1rem;
  padding-top: calc(0.75rem + env(safe-area-inset-top));
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: relative;
  z-index: 30;
}
.hdr .brand { display: flex; align-items: center; gap: 0.65rem; }
.hdr .brand-logo { width: 38px; height: 38px; display: block; object-fit: cover; border-radius: 22%; flex-shrink: 0; }
.hdr .brand b { font-size: 1.02rem; color: var(--navy-900); display: block; line-height: 1.1; font-weight: 700; }
.hdr .brand small { color: var(--text-muted); font-size: 0.64rem; letter-spacing: 0.5px; }
.hdr .brand-copy { display:flex; flex-direction:column; align-items:flex-start; gap:.18rem; min-width:0; }
.hdr .brand-copy small { letter-spacing:0; }
.live-indicator { display:inline-flex; align-items:center; gap:.3rem; color:#15803d; font-size:.58rem; font-weight:700; white-space:nowrap; }
.live-indicator i { width:6px; height:6px; border-radius:50%; background:#22c55e; box-shadow:0 0 0 3px rgba(34,197,94,.13); animation:live-pulse 2s ease-in-out infinite; }
@keyframes live-pulse { 0%,100%{opacity:1} 50%{opacity:.45} }
.hdr .u { display: flex; align-items: center; gap: 0.6rem; }
.hdr .av {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--navy-50);
  border: 1px solid var(--border);
  color: var(--navy-900);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 0.84rem;
}
.hdr button {
  min-height: 36px;
  min-width: 36px;
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  padding: 0.3rem;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-sm);
}
.hdr button:hover { color: var(--danger); background: var(--danger-light); }

/* الصفحة الرئيسية — ترويسة وبحث */
.home-hero {
  margin-bottom: 1.2rem;
  padding: 1.1rem;
  border-radius: var(--radius-lg);
  background:
    radial-gradient(circle at 100% 0%, rgba(197,168,128,.2), transparent 36%),
    linear-gradient(135deg, var(--navy-900), var(--navy-800));
  box-shadow: 0 10px 24px rgba(11, 27, 51, .14);
}
.home-hero .greeting { font-size: 0.8rem; color: #d9e2ef; font-weight: 600; margin-bottom: 0.2rem; display: block; }
.home-hero h2 { font-size: 1.35rem; color: #ffffff; font-weight: 800; line-height: 1.3; margin-bottom: 0.85rem; }
.home-search {
  display: flex;
  align-items: center;
  gap: 0.45rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 0.3rem 0.45rem 0.3rem 0.85rem;
  box-shadow: 0 5px 14px rgba(6, 14, 26, .14);
}
.home-search:focus-within { border-color: var(--navy-700); }
.home-search .inp { border: none; padding: 0.45rem 0; font-size: 0.86rem; flex: 1; min-height: auto; }
.home-search .inp:focus { box-shadow: none; }
.home-search .btn { min-height: 36px; padding: 0.45rem 0.9rem; }

/* تصنيفات واختصارات سريعة */
.cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.55rem; margin-bottom: 1.1rem; }
.cat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 0.75rem 0.3rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--navy-900);
  cursor: pointer;
  font-family: inherit;
  box-shadow: 0 3px 10px rgba(11, 27, 51, .05);
  min-height: 72px;
  justify-content: center;
}
.cat:hover { border-color: var(--navy-700); background: var(--navy-50); }
.cat .ci {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  background: var(--navy-50);
  color: var(--navy-800);
  display: flex;
  align-items: center;
  justify-content: center;
}
.cat:hover .ci { background: var(--navy-800); color: #fff; }
.destination-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .7rem; }
.destination-card {
  position: relative;
  min-height: 176px;
  overflow: hidden;
  border-radius: var(--radius-lg);
  background: var(--navy-900);
  color: #fff;
  border: 1px solid rgba(255,255,255,.14);
  text-align: right;
  cursor: pointer;
  padding: 0;
  font-family: inherit;
}
.destination-card::after {
  content: '';
  position: absolute;
  inset: 35% 0 0;
  background: linear-gradient(180deg, transparent, rgba(6,14,26,.88));
}
.destination-card img { width: 100%; height: 100%; position: absolute; inset: 0; object-fit: cover; opacity: .86; }
.destination-card .dc-copy { position: absolute; inset: auto .85rem .75rem; z-index: 1; }
.destination-card b { display: block; font-size: .98rem; line-height: 1.2; }
.destination-card span { display: block; font-size: .68rem; color: #e4eaf2; margin-top: .25rem; }
.destination-card .dc-arrow { position: absolute; top: .7rem; left: .7rem; z-index: 1; width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,.9); color: var(--navy-900); display: grid; place-items: center; font-size: .9rem; }
@media (max-width: 350px) {
  .destination-grid { grid-template-columns: 1fr; }
}

/* الشرائح والكبسولات */
.row { display: flex; gap: 0.45rem; overflow-x: auto; padding-bottom: 0.35rem; scrollbar-width: none; }
.row::-webkit-scrollbar { display: none; }
.chip {
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: var(--radius-full);
  padding: 0.45rem 0.95rem;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text-muted);
  cursor: pointer;
  white-space: nowrap;
  font-family: inherit;
  min-height: 36px;
  display: inline-flex;
  align-items: center;
}
.chip:hover { border-color: var(--navy-700); color: var(--navy-900); }
.chip.on {
  background: var(--navy-800);
  border-color: var(--navy-800);
  color: #ffffff;
}

/* خط الرحلة والتجهيز */
.trip-summary {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 1rem;
  margin-bottom: 1rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: var(--shadow-sm);
}
.trip-summary h2 { font-size: 1.05rem; color: var(--navy-900); font-weight: 700; margin-bottom: 0.2rem; }
.trip-summary p { color: var(--text-muted); font-size: 0.76rem; }
.timeline { border-right: 2px solid var(--border); padding-right: 0.9rem; margin: 0.5rem 0.5rem 0.9rem 0; }
.tl { position: relative; margin-bottom: 0.75rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0.6rem 0.75rem; }
.tl::before {
  content: '';
  position: absolute;
  right: -1.25rem;
  top: 0.75rem;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--gold);
  border: 2px solid var(--surface);
}
.tl b { font-size: 0.84rem; color: var(--navy-900); }
.tl small { color: var(--text-muted); display: block; font-size: 0.72rem; margin-top: 0.15rem; }
.tl .del { float: left; background: none; border: none; color: var(--text-light); cursor: pointer; padding: 0.2rem; min-height: 28px; min-width: 28px; }
.tl .del:hover { color: var(--danger); }
.day-h {
  background: var(--navy-50);
  color: var(--navy-900);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 0.3rem 0.7rem;
  font-size: 0.76rem;
  font-weight: 700;
  margin: 0.7rem 0 0.5rem;
  display: inline-block;
}
.check {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.6rem 0;
  border-bottom: 1px solid var(--border-subtle);
  font-size: 0.84rem;
  min-height: 40px;
}
.check input { accent-color: var(--navy-800); width: 18px; height: 18px; cursor: pointer; }
.check .done { text-decoration: line-through; color: var(--text-light); }
.prog { height: 6px; background: var(--border); border-radius: var(--radius-full); overflow: hidden; margin: 0.5rem 0 0.8rem; }
.prog i { display: block; height: 100%; background: var(--gold); border-radius: var(--radius-full); }

/* الخريطة والأدوات */
iframe.map { width: 100%; height: 240px; border: 1px solid var(--border); border-radius: var(--radius-md); }
.tools { display: grid; grid-template-columns: 1fr 1fr; gap: 0.65rem; margin-top: 0.65rem; }
.wth b { font-size: 1.5rem; color: var(--navy-900); font-weight: 800; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.55rem; }

/* المجتمع */
.post { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; margin-bottom: 0.85rem; box-shadow: var(--shadow-sm); }
.post img { width: 100%; height: 170px; object-fit: cover; display: block; }
.post .noimg { height: 110px; background: var(--navy-50); display: flex; align-items: center; justify-content: center; color: var(--text-light); }
.post .pb { padding: 0.75rem 0.85rem; }
.post .pb p { font-size: 0.82rem; color: var(--text-main); margin-bottom: 0.45rem; line-height: 1.5; }
.post .pm { display: flex; justify-content: space-between; align-items: center; color: var(--text-muted); font-size: 0.72rem; }
.post .like { display: flex; align-items: center; gap: 0.3rem; background: none; border: none; color: var(--danger); cursor: pointer; font-family: inherit; font-size: 0.74rem; font-weight: 700; padding: 0.2rem 0; min-height: 32px; }

/* المحادثة / مساعد السفر */
.chat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 0.85rem;
  height: 320px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 0.55rem;
  margin-bottom: 0.65rem;
}
.msg { max-width: 82%; padding: 0.65rem 0.9rem; border-radius: var(--radius-md); font-size: 0.82rem; line-height: 1.6; white-space: pre-line; }
.msg.bot { background: var(--bg); color: var(--text-main); align-self: flex-start; border-bottom-right-radius: 2px; border: 1px solid var(--border-subtle); }
.msg.me { background: var(--navy-800); color: #ffffff; align-self: flex-end; border-bottom-left-radius: 2px; }
.sugs { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.65rem; }

/* شريط التنقل السفلي — Mobile Native */
.bnav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 440px;
  background: var(--surface);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  display: flex;
  z-index: 40;
  border-top: 1px solid var(--border);
  box-shadow: 0 -4px 16px rgba(11, 27, 51, 0.04);
  padding: 0.35rem 0 calc(0.35rem + env(safe-area-inset-bottom));
}
.bnav button {
  flex: 1;
  min-height: 48px;
  background: none;
  border: none;
  color: var(--text-muted);
  padding: 0.3rem 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  font-size: 0.65rem;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  position: relative;
}
.bnav button:active { transform: none; }
 .bnav button.on { color: #ffcc33; font-weight: 700; }
.bnav button.on { background: var(--gold-light); border-radius: var(--radius-md); }
.bnav button.on::after {
  content: '';
  position: absolute;
  bottom: 2px;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--gold);
}
.brand-logo { box-shadow: 0 2px 8px rgba(11, 27, 51, 0.14); }
.foot { text-align: center; color: var(--text-light); font-size: 0.68rem; padding: 1.2rem 0 0.5rem; }

 </div>`;}
function doLogin(){const u=lg('sb_users',[]).find(x=>x.email===$('aEmail').value.trim()&&x.pass===$('aPass').value);
 if(u){session={name:u.name,email:u.email};ls('sb_session',session);render();}else $('aErr').textContent='البريد أو كلمة المرور غير صحيحة.';}
function doReg(){const name=$('rName').value.trim(),email=$('aEmail').value.trim(),pass=$('aPass').value;
 if(!name||!email||pass.length<4){$('aErr').textContent='المرجو ملء جميع الخانات (كلمة المرور 4 أحرف فأكثر).';return;}
 const u=lg('sb_users',[]);if(u.find(x=>x.email===email)){$('aErr').textContent='هذا البريد مسجل من قبل.';return;}
 u.push({name,email,pass});ls('sb_users',u);session={name,email};ls('sb_session',session);render();}
function doOut(){session=null;ls('sb_session',null);render();}

/* ===== الهيكل ===== */
 function appHTML(){return `

 </div>

function bind(){const P=$('pg');if(!P)return;({home:pgHome,trip:pgTrip,explore:pgExplore,map:pgMap,community:pgCommunity,bot:pgBot})[page](P);}

function pgTrip(P){let t=lg('sb_trip',null);
 if(!t){P.innerHTML=`<div class="sec">تخطيط رحلة جديدة</div>
  <div class="empty-state" style="margin-bottom:1rem">
   <div class="es-icon">${ic('plane',22)}</div>
   <h3>ابدأ رحلتك الأولى</h3>
  </div>
  <div class="card"><label>الوجهة<select class="inp" id="tCity">${Object.keys(CITIES).map(c=>`<option value="${c}">${CITIES[c].n} — ${CITIES[c].c}</option>`).join('')}</select></label>
  <div class="grid2">
   <label>تاريخ الذهاب<input class="inp" type="date" id="tFrom" value="2026-09-01"></label>
   <label>تاريخ العودة<input class="inp" type="date" id="tTo" value="2026-09-03"></label>
  </div>
  <button class="btn navy w" style="margin-top:.4rem" onclick="mkTrip()">${ic('plane',16)} إنشاء خطة الرحلة</button></div>`;return;}
  t.days=Array.isArray(t.days)?t.days:[];t.check=Array.isArray(t.check)?t.check:[];
  const days=Math.min(7,Math.max(1,Math.round((new Date(t.to)-new Date(t.from))/864e5)+1));
 while(t.days.length<days)t.days.push([]);
 P.innerHTML=`
  <div class="trip-summary">
   <div><h2>رحلتك إلى ${CITIES[t.city]?CITIES[t.city].n:esc(t.city)}</h2><p>${esc(t.from)} ← ${esc(t.to)} • ${days} أيام</p></div>
   <button class="btn sm ghost" onclick="if(confirm('حذف الرحلة؟')){ls('sb_trip',null);render()}" title="حذف الرحلة">${ic('trash',14)}</button>
  </div>
  <div class="sec">خطة الأيام</div>
  ${Array.from({length:days},(_,d)=>`<div class="day-h">اليوم ${d+1}</div><div class="timeline">
    ${t.days[d].map((it,ix)=>`<div class="tl"><button class="del" onclick="delItem(${d},${ix})">${ic('trash',13)}</button><b>${esc(it.title)}</b><small>${esc(it.time)} • ${esc(it.type)}</small></div>`).join('')||'<small style="color:var(--text-muted);display:block;padding:.4rem 0">لا توجد أنشطة بعد</small>'}
  </div>`).join('')}
  <div class="card"><div class="sec" style="margin-top:0">إضافة نشاط</div>
   <div class="grid2"><label>اليوم<select class="inp" id="iDay">${Array.from({length:days},(_,d)=>`<option value="${d}">اليوم ${d+1}</option>`).join('')}</select></label>
   <label>الوقت<input class="inp" type="time" id="iTime" value="10:00"></label></div>
   <label>النشاط<input class="inp" id="iTitle" placeholder="مثال: زيارة المعالم التاريخية"></label>
   <label>النوع<select class="inp" id="iType"><option>معلم سياحي</option><option>تنقل</option><option>مطعم</option><option>فندق</option><option>تسوق</option></select></label>
   <button class="btn navy w" onclick="addItem()">${ic('plus',16)} إضافة النشاط</button></div>
  <div class="sec">قائمة الحاجيات والتجهيزات</div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;font-size:.75rem;color:var(--text-muted)"><span>نسبة الجاهزية</span><b>${t.check.length?Math.round(t.check.filter(c=>c.done).length/t.check.length*100):0}%</b></div>
    <div class="prog"><i style="width:${t.check.length?Math.round(t.check.filter(c=>c.done).length/t.check.length*100):0}%"></i></div>
   ${t.check.map((c,ix)=>`<div class="check"><input type="checkbox" ${c.done?'checked':''} onchange="togCheck(${ix})"><span class="${c.done?'done':''}">${c.t}</span></div>`).join('')}
   <div style="display:flex;gap:.45rem;margin-top:.85rem"><input class="inp" id="newCh" placeholder="إضافة حاجة جديدة..."><button class="btn sm navy" onclick="addCheck()">${ic('plus',14)} إضافة</button></div>
  </div>`;}
function mkTrip(){const from=$('tFrom').value,to=$('tTo').value;
 if(new Date(to)<new Date(from)){alert('تاريخ العودة قبل الذهاب!');return;}
 ls('sb_trip',{city:$('tCity').value,from,to,days:[],check:['جواز السفر','تذاكر السفر','حجز الفندق','تأمين السفر','شاحن الهاتف','أدوية شخصية'].map(t=>({t,done:false}))});render();}
function addItem(){const t=lg('sb_trip',null);const title=$('iTitle').value.trim();if(!title)return;
 t.days[+$('iDay').value].push({title,time:$('iTime').value,type:$('iType').value});ls('sb_trip',t);render();}
function delItem(d,ix){const t=lg('sb_trip',null);t.days[d].splice(ix,1);ls('sb_trip',t);render();}
function togCheck(ix){const t=lg('sb_trip',null);t.check[ix].done=!t.check[ix].done;ls('sb_trip',t);render();}
function addCheck(){const v=$('newCh').value.trim();if(!v)return;const t=lg('sb_trip',null);t.check.push({t:v,done:false});ls('sb_trip',t);render();}

function pgMap(P){const C=CITIES[city]||CITIES.istanbul;
 P.innerHTML=`
  <div class="sec">الخريطة والأدوات — ${C.n}</div>
  ${cityChips()}
  <iframe class="map" src="https://www.openstreetmap.org/export/embed.html?bbox=${C.lon-.08}%2C${C.lat-.05}%2C${C.lon+.08}%2C${C.lat+.05}&layer=mapnik&marker=${C.lat}%2C${C.lon}"></iframe>
  <div style="margin:.65rem 0"><a class="btn sm ghost w" target="_blank" href="https://www.google.com/maps/@${C.lat},${C.lon},13z">${ic('map',15)} فتح في خرائط جوجل</a></div>
  <div class="tools">
   <div class="card" style="margin:0"><div class="sec" style="margin:0 0 .45rem">الطقس الآن</div><div id="wBox" style="font-size:.76rem;color:var(--text-muted)">جارِ التحميل...</div></div>
   <div class="card" style="margin:0"><div class="sec" style="margin:0 0 .45rem">تحويل العملات</div>
    <input class="inp" type="number" id="cvA" value="100" oninput="doCv()" style="margin-bottom:.45rem">
    <div class="grid2"><select class="inp" id="cvF" onchange="doCv()">${Object.keys(RATES).map(r=>`<option ${r==='MAD'?'selected':''}>${r}</option>`).join('')}</select>
    <select class="inp" id="cvT" onchange="doCv()">${Object.keys(RATES).map(r=>`<option ${r==='TRY'?'selected':''}>${r}</option>`).join('')}</select></div>
    <div id="cvR" style="font-weight:800;color:var(--navy-900);margin-top:.45rem;font-size:.88rem"></div>
    <small style="color:var(--text-light);font-size:.64rem">أسعار تقريبية</small></div>
  </div>`;
 doCv();
  fetch(`https://api.open-meteo.com/v1/forecast?latitude=${C.lat}&longitude=${C.lon}&current=temperature_2m,weather_code,wind_speed_10m`)
   .then(r=>{if(!r.ok)throw new Error('weather');return r.json();})
   .then(j=>{const box=$('wBox');if(!box||!j.current)return;const w=j.current;box.innerHTML=`<b>${Math.round(w.temperature_2m)}°</b> ${wtxt(w.weather_code)}<br><span style="font-size:.7rem">الرياح: ${Math.round(w.wind_speed_10m)} كم/س</span>`;})
   .catch(()=>{const box=$('wBox');if(box)box.textContent='تعذر الاتصال بخدمة الطقس';});}
function wtxt(c){return c===0?'صحو':c<3?'غائم جزئياً':c<45?'غائم':c<50?'ضباب':c<70?'أمطار':c<85?'ثلوج':'عاصفة';}
function doCv(){const a=+$('cvA').value||0,f=$('cvF').value,t=$('cvT').value;
 $('cvR').textContent=(a/RATES[f]*RATES[t]).toFixed(2)+' '+t;}

function pgCommunity(P){const posts=lg('sb_posts',[]);
 P.innerHTML=`
  <div class="sec">مجتمع المسافرين</div>
  <p style="font-size:.76rem;color:var(--text-muted);margin-bottom:.75rem">شارك لحظات وتجارب رحلاتك مع باقي المسافرين.</p>

  </div>
  ${posts.length?[...posts].reverse().map((p,ri)=>{const ix=posts.length-1-ri;return `<div class="post">${p.img?`<img src="${p.img}">`:`<div class="noimg">${ic('cam',26)}</div>`}
    <div class="pb"><p>${esc(p.cap)}</p><div class="pm"><span>${ic('user',12)} ${esc(p.by)}</span>
   <button class="like" onclick="likePost(${ix})">${ic('heart',14)} ${p.likes||0}</button></div></div></div>`;}).join(''):`
  <div class="empty-state">

function addPost(){const f=$('pFile').files[0],cap=$('pCap').value.trim();
 if(!f&&!cap){alert('أضف صورة أو وصفا على الأقل.');return;}
 const save=img=>{const posts=lg('sb_posts',[]);posts.push({img,cap,by:session.name,likes:0});
  try{ls('sb_posts',posts);}catch(e){alert('مساحة التخزين ممتلئة — احذف بعض المشاركات القديمة.');return;}
  render();};
 if(f){const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');const s=Math.min(1,600/Math.max(img.width,img.height));c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);save(c.toDataURL('image/jpeg',.7));};img.src=r.result;};r.readAsDataURL(f);}else save(null);}
function likePost(ix){const p=lg('sb_posts',[]);p[ix].likes=(p[ix].likes||0)+1;ls('sb_posts',p);render();}

function pgBot(P){P.innerHTML=`
  <div class="sec">Sindbad Concierge</div>
   <div class="chat" id="chatBox">${chat.map(m=>`<div class="msg ${m.who}">${esc(m.txt).replace(/\n/g,'<br>')}</div>`).join('')}</div>
  <div class="sugs">${['جهز حقيبتي','اكتشف وجهة','ساعدني أثناء السفر','خطط رحلتي'].map(s=>`<button class="chip" onclick="ask('${s}')">${s}</button>`).join('')}</div>
  <div style="display:flex;gap:.45rem"><input class="inp" id="bIn" placeholder="اكتب استفسارك هنا..." onkeydown="if(event.key==='Enter')ask()"><button class="btn navy" onclick="ask()">${ic('send',15)}</button></div>`;
 const cb=$('chatBox');cb.scrollTop=cb.scrollHeight;}
function ask(q){const txt=q||$('bIn').value.trim();if(!txt)return;
 chat.push({who:'me',txt});const C=CITIES[city]||CITIES.istanbul;let a='';
 if(txt.includes('حقيبة')||txt.includes('تجهيز')||txt.includes('شنطة'))a='نصائح لتجهيز حقيبة السفر:\n• احرص على وضع الوثائق المهمة والشواحن في الحقيبة اليدوية.\n• استخدم قائمة التجهيزات في صفحة "رحلتي" لتتبع المستلزمات خطوة بخطوة.\n• تأكد من وزن الحقائب المسموح به في تذكرتك.';
 else if(txt.includes('عمل')||txt.includes('درهم')||txt.includes('دولار')||txt.includes('صرف'))a='يمكنك تحويل وحساب أسعار صرف العملات فوراً من صفحة "الخريطة" عبر حاسبة العملات المدمجة.';
 else if(txt.includes('طقس')||txt.includes('جو'))a='يمكنك الاطلاع على حالة الطقس الحية لمدينتك المختارة مباشرة من صفحة "الخريطة والأدوات".';
 else if(txt.includes('رحل')||txt.includes('خطة')||txt.includes('تنظيم'))a='لإنشاء جدول رحلة مخصص، توجه إلى صفحة "رحلتي"، حدد الوجهة وتواريخ السفر وستحصل على جدول تفاعلي للأيام مع قائمة المهام.';

 let destination = lg('sb_destination', null);

 const apiGet = (path) => {
   const isPages = location.hostname.endsWith('github.io');
   if (!isPages) return fetch(path).then((res) => { if (!res.ok) throw new Error('api_error'); return res.json(); });
   const query = new URL(path, location.href);
   if (query.pathname === '/api/search') {
     return fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=8&accept-language=ar,en&q=${encodeURIComponent(query.searchParams.get('q') || '')}`)
       .then((res) => res.json()).then((items) => items.map((item) => ({ id:item.place_id, name:item.name || item.display_name.split(',')[0], displayName:item.display_name, lat:Number(item.lat), lon:Number(item.lon), country:item.address?.country || '', type:item.type })));
   }
   if (query.pathname === '/api/places') {
     const lat=Number(query.searchParams.get('lat')), lon=Number(query.searchParams.get('lon')), kind=query.searchParams.get('kind') || 'tourism';
     const filter=kind==='food'?'["amenity"~"restaurant|cafe|fast_food"]':kind==='hotels'?'["tourism"~"hotel|hostel|guest_house"]':'["tourism"~"attraction|museum|gallery|viewpoint|theme_park"]';
     const overpass=`[out:json][timeout:20];(nwr(around:6000,${lat},${lon})${filter};);out center tags 25;`;
     return fetch(`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(overpass)}`).then((res)=>{if(!res.ok)throw new Error('places_error');return res.json();}).then((data)=>(data.elements||[]).map((item)=>({id:`${item.type}/${item.id}`,name:item.tags?.name||item.tags?.['name:en']||'',category:item.tags?.amenity||item.tags?.tourism||kind,address:item.tags?.['addr:street']||item.tags?.['addr:city']||'',lat:item.lat??item.center?.lat,lon:item.lon??item.center?.lon,website:item.tags?.website||item.tags?.['contact:website']||'',phone:item.tags?.phone||''})).filter((item)=>item.name&&Number.isFinite(item.lat)&&Number.isFinite(item.lon)));
   }
   if (query.pathname === '/api/weather') {
     return fetch(`https://api.open-meteo.com/v1/forecast?latitude=${query.searchParams.get('lat')}&longitude=${query.searchParams.get('lon')}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&timezone=auto`).then((res)=>{if(!res.ok)throw new Error('weather_error');return res.json();});
   }
   if (query.pathname === '/api/rates') {
     return fetch(`https://open.er-api.com/v6/latest/${encodeURIComponent(query.searchParams.get('base') || 'MAD')}`).then((res)=>{if(!res.ok)throw new Error('rates_error');return res.json();});
   }
   return Promise.reject(new Error('api_error'));
 };
 const destinationLabel = () => destination ? `${esc(destination.name)}${destination.country ? ` — ${esc(destination.country)}` : ''}` : 'اختر وجهتك من البحث';

 };

  let deferredInstallPrompt = null;

 function delItem(d,ix) { const t=lg('sb_trip',null); if(!t)return; t.days[d].splice(ix,1); ls('sb_trip',t); render(); }
 function togCheck(ix) { const t=lg('sb_trip',null); if(!t)return; t.check[ix].done=!t.check[ix].done; ls('sb_trip',t); render(); }

 function doCv() { const box=$('cvR'); if(!box||!liveRates)return; const amount=Number($('cvA').value)||0, from=$('cvF').value, to=$('cvT').value; const rates={MAD:1,...liveRates.rates}; if(from==='MAD'&&rates[to])box.textContent=`${(amount*rates[to]).toFixed(2)} ${to}`; else if(rates[from]&&rates[to])box.textContent=`${(amount/rates[from]*rates[to]).toFixed(2)} ${to}`; }
