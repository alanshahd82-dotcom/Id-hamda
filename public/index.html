<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Sindbad — مساعدك الذكي للسفر</title>
<meta name="theme-color" content="#0B1D3A">
<meta name="application-name" content="My Sindbad">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Sindbad">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B1D3A;--blue:#0E3A6D;--gold:#D4AF37;--gold-d:#b8952c;--cream:#F8F4EC;--gray:#E6E8EC;--text:#1c2b45;--muted:#6b7a93}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',Tahoma,sans-serif}
body{background:#081426}
.hidden{display:none!important}
.en{font-family:'Playfair Display',serif}
.shell{max-width:460px;margin:0 auto;min-height:100vh;background:var(--cream);position:relative;padding-bottom:76px;box-shadow:0 0 80px rgba(0,0,0,.6)}
.inp{width:100%;padding:.6rem .9rem;border:1.5px solid #ddd6c8;border-radius:10px;font-size:.88rem;background:#fff;color:var(--text)}
.inp:focus{outline:none;border-color:var(--gold)}
label{display:block;font-size:.75rem;color:var(--muted);font-weight:600;margin-bottom:.7rem}
label .inp{margin-top:.25rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;background:var(--gold);color:var(--navy);border:none;border-radius:10px;padding:.65rem 1.2rem;font-weight:700;font-size:.88rem;cursor:pointer;font-family:inherit}
.btn:active{transform:scale(.98)}
.btn.navy{background:var(--blue);color:#fff}
.btn.ghost{background:#fff;border:1.5px solid #ddd6c8;color:var(--text)}
.btn.sm{padding:.35rem .8rem;font-size:.75rem;border-radius:8px}
.btn.w{width:100%}
/* شاشة الدخول */
.auth{min-height:100vh;background:linear-gradient(170deg,var(--navy) 20%,var(--blue));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1.4rem;text-align:center}
.auth .logo{width:90px;height:90px;margin-bottom:.6rem}
.auth h1{font-size:2rem;color:var(--gold);margin-bottom:.1rem}
.auth .tag{color:#bcd0e8;font-size:.8rem;letter-spacing:2px;margin-bottom:1.4rem}
.auth-card{background:#fff;color:var(--text);border-radius:16px;padding:1.4rem;width:100%;max-width:340px;text-align:right;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.auth-card .tabs{display:flex;background:#f1ede2;border-radius:10px;padding:4px;margin-bottom:1rem}
.auth-card .tabs button{flex:1;border:none;background:none;padding:.5rem;border-radius:8px;font-weight:700;font-size:.82rem;color:var(--muted);cursor:pointer;font-family:inherit}
.auth-card .tabs button.on{background:var(--navy);color:var(--gold)}
.auth-card .err{color:#c0392b;font-size:.75rem;min-height:1.1rem;margin:.2rem 0}
.auth-card .free{margin-top:.8rem;background:#eaf7ec;color:#1e7e34;border-radius:8px;padding:.45rem;font-size:.72rem;font-weight:700;text-align:center}
.auth .feat{display:flex;gap:.5rem;margin-top:1.3rem;flex-wrap:wrap;justify-content:center}
.auth .feat span{border:1px solid rgba(212,175,55,.4);color:var(--gold);border-radius:99px;padding:.25rem .8rem;font-size:.68rem}
/* الهيدر */
.hdr{background:linear-gradient(160deg,var(--navy),var(--blue));color:#fff;padding:.8rem 1rem;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.hdr .brand{display:flex;align-items:center;gap:.6rem}
.hdr .brand svg{width:34px;height:34px}
.hdr .brand b{font-size:1.05rem;color:var(--gold);display:block;line-height:1.1}
.hdr .brand small{color:#bcd0e8;font-size:.62rem;letter-spacing:1.5px}
.hdr .u{display:flex;align-items:center;gap:.5rem}
.hdr .av{width:32px;height:32px;border-radius:50%;background:var(--gold);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.8rem}
.hdr button{background:none;border:none;color:#bcd0e8;cursor:pointer;padding:.2rem}
.content{padding:1rem}
.sec{display:flex;align-items:center;gap:.5rem;color:var(--navy);font-weight:900;font-size:.95rem;margin:1rem 0 .6rem}
.sec::after{content:'';flex:1;height:1px;background:#ddd6c8}
.card{background:#fff;border-radius:14px;padding:.95rem;margin-bottom:.8rem;box-shadow:0 2px 10px rgba(11,29,58,.07)}
.hero{background:linear-gradient(150deg,var(--navy),var(--blue));color:#fff;border-radius:16px;padding:1.1rem;margin-bottom:.9rem;position:relative;overflow:hidden}
.hero h2{font-size:1.15rem;margin-bottom:.2rem}
.hero p{color:#bcd0e8;font-size:.75rem;margin-bottom:.8rem}
.hero .search{display:flex;gap:.4rem}
.hero .search .inp{border:none}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem;margin-bottom:.9rem}
.cat{background:#fff;border:none;border-radius:12px;padding:.7rem .3rem;display:flex;flex-direction:column;align-items:center;gap:.4rem;font-size:.66rem;font-weight:700;color:var(--navy);cursor:pointer;box-shadow:0 2px 10px rgba(11,29,58,.07);font-family:inherit}
.cat .ci{width:38px;height:38px;border-radius:12px;background:var(--navy);color:var(--gold);display:flex;align-items:center;justify-content:center}
.dest{display:flex;gap:.7rem;align-items:center;background:#fff;border-radius:14px;padding:.6rem;margin-bottom:.6rem;box-shadow:0 2px 10px rgba(11,29,58,.07)}
.dest .ph{width:64px;height:64px;border-radius:12px;background:linear-gradient(140deg,var(--blue),var(--navy));color:var(--gold);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dest b{font-size:.85rem;display:block}
.dest small{color:var(--muted);font-size:.7rem}
.row{display:flex;gap:.5rem;overflow-x:auto;padding-bottom:.3rem}
.chip{border:1.5px solid #ddd6c8;background:#fff;border-radius:99px;padding:.35rem .9rem;font-size:.72rem;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;font-family:inherit}
.chip.on{background:var(--navy);border-color:var(--navy);color:var(--gold)}
.item{display:flex;gap:.7rem;background:#fff;border-radius:14px;padding:.75rem;margin-bottom:.6rem;box-shadow:0 2px 10px rgba(11,29,58,.07);align-items:center}
.item .ic{width:42px;height:42px;border-radius:12px;background:var(--cream);color:var(--gold-d);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.item b{font-size:.84rem;display:block}
.item small{color:var(--muted);font-size:.68rem}
.item .end{margin-right:auto;text-align:left}
.stars{color:var(--gold);font-size:.72rem}
.price{color:var(--blue);font-weight:900;font-size:.85rem}
.timeline{border-right:2px solid var(--gold);padding-right:1rem;margin:.6rem 0}
.tl{position:relative;margin-bottom:.7rem}
.tl::before{content:'';position:absolute;right:-1.35rem;top:.35rem;width:10px;height:10px;border-radius:50%;background:var(--gold);border:2px solid var(--cream)}
.tl b{font-size:.8rem}
.tl small{color:var(--muted);display:block;font-size:.7rem}
.tl .del{float:left;background:none;border:none;color:#c0392b;cursor:pointer}
.day-h{background:var(--navy);color:var(--gold);border-radius:10px;padding:.4rem .8rem;font-size:.78rem;font-weight:700;margin:.8rem 0 .6rem;display:inline-block}
.check{display:flex;align-items:center;gap:.6rem;padding:.45rem 0;border-bottom:1px dashed #e5dfcf;font-size:.82rem}
.check input{accent-color:var(--gold);width:17px;height:17px}
.check .done{text-decoration:line-through;color:var(--muted)}
.prog{height:7px;background:#eee7d6;border-radius:99px;overflow:hidden;margin:.5rem 0}
.prog i{display:block;height:100%;background:var(--gold)}
iframe.map{width:100%;height:260px;border:none;border-radius:14px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.wth b{font-size:1.6rem;color:var(--blue)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.post{background:#fff;border-radius:14px;overflow:hidden;margin-bottom:.8rem;box-shadow:0 2px 10px rgba(11,29,58,.07)}
.post img{width:100%;height:170px;object-fit:cover;display:block}
.post .noimg{height:120px;background:linear-gradient(140deg,var(--blue),var(--navy));display:flex;align-items:center;justify-content:center;color:var(--gold)}
.post .pb{padding:.7rem .8rem}
.post .pb p{font-size:.8rem;margin-bottom:.4rem}
.post .pm{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.7rem}
.post .like{display:flex;align-items:center;gap:.3rem;background:none;border:none;color:#c0392b;cursor:pointer;font-family:inherit;font-size:.72rem;font-weight:700}
.chat{background:#fff;border-radius:14px;padding:.8rem;height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:.5rem;margin-bottom:.6rem}
.msg{max-width:85%;padding:.55rem .8rem;border-radius:12px;font-size:.8rem;line-height:1.7;white-space:pre-line}
.msg.bot{background:var(--cream);color:var(--text);align-self:flex-start;border-bottom-right-radius:4px}
.msg.me{background:var(--blue);color:#fff;align-self:flex-end;border-bottom-left-radius:4px}
.sugs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.6rem}
/* الشريط السفلي */
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;background:var(--navy);display:flex;z-index:6;border-top:1px solid rgba(212,175,55,.25)}
.bnav button{flex:1;background:none;border:none;color:#7d90ad;padding:.55rem 0 .6rem;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.6rem;font-weight:700;cursor:pointer;font-family:inherit}
.bnav button.on{color:var(--gold)}
.foot{text-align:center;color:var(--muted);font-size:.65rem;padding:1rem 0 .5rem}
</style>
</head>
<body>
<div class="shell" id="shell"></div>
<script>
/* ===== الأيقونات والشعار ===== */
const I={
home:'<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
plane:'<path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>',

cam:'<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',
chat:'<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>',
pin:'<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>',

food:'<path d="M5 2v6a3 3 0 0 0 6 0V2"/><line x1="8" y1="11" x2="8" y2="22"/><path d="M19 2c-2.5 4-2.5 8 0 10v10"/>',
star:'<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',

heart:'<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>',
cloud:'<path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>',

list:'<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>',
user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>',
nav:'<polygon points="3 11 22 2 13 21 11 13 3 11"/>'
};
const ic=(n,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
const LOGO=`<svg viewBox="0 0 64 64" fill="none"><path d="M46 6a27 27 0 1 0 0 52A31 31 0 0 1 46 6z" fill="#D4AF37"/><path d="M20 40h26l-5 9H25z" fill="#0E3A6D" stroke="#D4AF37" stroke-width="1.5"/><path d="M32 14v26" stroke="#D4AF37" stroke-width="2"/><path d="M32 16c9 5 11 14 11 24H32z" fill="#F8F4EC"/><path d="M32 20c-6 4-8 12-8 20h8z" fill="#e2d7bd"/><path d="M14 52c4 3 8 3 12 0s8-3 12 0 8 3 12 0" stroke="#F8F4EC" stroke-width="2.5" stroke-linecap="round"/><circle cx="50" cy="14" r="1.6" fill="#D4AF37"/><circle cx="55" cy="22" r="1.2" fill="#D4AF37"/></svg>`;

/* ===== البيانات ===== */
const CITIES={
 istanbul:{n:'إسطنبول',c:'تركيا',lat:41.01,lon:28.97,hotels:[{n:'فندق سينوم هوتل',p:120,r:4.7},{n:'فندق راديسون بلو',p:150,r:4.5},{n:'فندق CW بيوغلو',p:90,r:4.3}],rest:[{n:'مطعم حمادي',t:'مأكولات تركية'},{n:'مطعم سلطان المشاوي',t:'مشاوي'},{n:'مقهى بييرا',t:'حلويات وقهوة'}],spots:[{n:'آيا صوفيا',d:'تحفة معمارية تاريخية'},{n:'البازار الكبير',d:'سوق تاريخي بآلاف المحلات'},{n:'برج غلطة',d:'إطلالة بانورامية على المدينة'}]},
 marrakech:{n:'مراكش',c:'المغرب',lat:31.63,lon:-7.99,hotels:[{n:'رياض النخيل',p:70,r:4.8},{n:'فندق المنارة',p:110,r:4.6},{n:'دار الضيافة القديمة',p:45,r:4.4}],rest:[{n:'مطعم دار يسيف',t:'طبخ مغربي'},{n:'كافيه غلوريا',t:'عصري'},{n:'مطعم المدينة',t:'مشاوي'}],spots:[{n:'جامع الفنا',d:'ساحة تاريخية نابضة'},{n:'حديقة ماجوريل',d:'حديقة عالمية شهيرة'},{n:'قصر الباهية',d:'عمارة أندلسية رائعة'}]},
 dubai:{n:'دبي',c:'الإمارات',lat:25.2,lon:55.27,hotels:[{n:'فندق العنوان',p:220,r:4.8},{n:'روف داون تاون',p:130,r:4.5},{n:'إيبس النجمة',p:80,r:4.2}],rest:[{n:'مطعم أربيان تيبس',t:'خليجي'},{n:'مطعم بيت البحر',t:'بحري'},{n:'كافيه رايتش',t:'فطور وحلويات'}],spots:[{n:'برج خليفة',d:'أعلى برج في العالم'},{n:'دبي مول',d:'أكبر مركز تسوق'},{n:'خور دبي',d:'جولة بالقوارب التقليدية'}]},
 cairo:{n:'القاهرة',c:'مصر',lat:30.04,lon:31.24,hotels:[{n:'فندق النيل الكبير',p:95,r:4.6},{n:'فندق وسط البلد',p:60,r:4.3},{n:'دار مصر القديمة',p:40,r:4.4}],rest:[{n:'مطعم أم كلثوم',t:'شرقي'},{n:'كشري التحرير',t:'شعبي'},{n:'قهوة الفيشاوي',t:'تاريخي'}],spots:[{n:'أهرامات الجيزة',d:'أعجوبة الدنيا القديمة'},{n:'المتحف المصري',d:'آثار فرعونية'},{n:'خان الخليلي',d:'سوق تاريخي'}]},
 paris:{n:'باريس',c:'فرنسا',lat:48.85,lon:2.35,hotels:[{n:'فندق اللوفر',p:190,r:4.7},{n:'hotel مونمارتر',p:110,r:4.4},{n:'إيبس باستيل',p:85,r:4.2}],rest:[{n:'مطعم لوتيس',t:'فرنسي راق'},{n:'كافيه دو باري',t:'مقهى'},{n:'مطعم الشام',t:'شرقي'}],spots:[{n:'برج إيفل',d:'رمز باريس'},{n:'متحف اللوفر',d:'أكبر متحف فني'},{n:'قوس النصر',d:'معلم تاريخي'}]}
};
const RATES={USD:1,EUR:.92,GBP:.79,TRY:33,MAD:10.1,AED:3.67,SAR:3.75,EGP:47.5};
const NAVB=[{id:'home',t:'الرئيسية',i:'home'},{id:'trip',t:'رحلتي',i:'plane'},{id:'explore',t:'استكشف',i:'compass'},{id:'map',t:'الخريطة',i:'map'},{id:'community',t:'المجتمع',i:'cam'},{id:'bot',t:'المساعد',i:'chat'}];
const $=id=>document.getElementById(id);
const ls=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const lg=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d;}catch(e){return d;}};
let session=lg('sb_session',null), city='istanbul', page='home', tab='hotels', authTab='login', chat=[];

/* ===== الدخول ===== */
function render(){ $('shell').innerHTML = session ? appHTML() : authHTML(); bind(); }
function authHTML(){return `
 <div class="auth">
  <div class="logo">${LOGO}</div>
  <h1 class="en">My Sindbad</h1>
  <div class="tag">YOUR AI TRAVEL COMPANION</div>
  <div class="auth-card">
   <div class="tabs">
    <button class="${authTab==='login'?'on':''}" onclick="authTab='login';render()">تسجيل الدخول</button>
    <button class="${authTab==='reg'?'on':''}" onclick="authTab='reg';render()">حساب جديد</button>
   </div>
   ${authTab==='reg'?'<label>الاسم الكامل<input class="inp" id="rName"></label>':''}
   <label>البريد الإلكتروني<input class="inp" id="aEmail" type="email"></label>
   <label>كلمة المرور<input class="inp" id="aPass" type="password"></label>
   <div class="err" id="aErr"></div>
   <button class="btn w" onclick="${authTab==='reg'?'doReg()':'doLogin()'}">${authTab==='reg'?'إنشاء حساب مجاني':'دخول'}</button>
   <button class="btn ghost w" style="margin-top:.5rem" onclick="session={name:'زائر',guest:1};ls('sb_session',session);render()">المتابعة كزائر</button>
   <div class="free">التسجيل مجاني 100% — بدون أي رسوم</div>
  </div>
  <div class="feat"><span>تخطيط رحلات ذكي</span><span>خرائط وتوجيهات</span><span>مجتمع المسافرين</span></div>
 </div>`;}
function doLogin(){const u=lg('sb_users',[]).find(x=>x.email===$('aEmail').value.trim()&&x.pass===$('aPass').value);
 if(u){session={name:u.name,email:u.email};ls('sb_session',session);render();}else $('aErr').textContent='البريد أو كلمة المرور غير صحيحة.';}
function doReg(){const name=$('rName').value.trim(),email=$('aEmail').value.trim(),pass=$('aPass').value;
 if(!name||!email||pass.length<4){$('aErr').textContent='المرجو ملء جميع الخانات (كلمة المرور 4 أحرف فأكثر).';return;}
 const u=lg('sb_users',[]);if(u.find(x=>x.email===email)){$('aErr').textContent='هذا البريد مسجل من قبل.';return;}
 u.push({name,email,pass});ls('sb_users',u);session={name,email};ls('sb_session',session);render();}
function doOut(){session=null;ls('sb_session',null);render();}

/* ===== الهيكل ===== */
function appHTML(){return `
 <div class="hdr">
  <div class="brand">${LOGO}<div><b class="en">My Sindbad</b><small>مساعدك الذكي للسفر</small></div></div>
  <div class="u"><div class="av">${(session.name||'ز').charAt(0)}</div><button onclick="doOut()" title="خروج">${ic('out',17)}</button></div>
 </div>
 <div class="content" id="pg"></div>
 <div class="foot">My Sindbad — النسخة التجريبية 1.0</div>
 <div class="bnav">${NAVB.map(n=>`<button class="${n.id===page?'on':''}" onclick="go('${n.id}')">${ic(n.i,19)}${n.t}</button>`).join('')}</div>`;}
function go(p){page=p;render();}
function bind(){const P=$('pg');if(!P)return;({home:pgHome,trip:pgTrip,explore:pgExplore,map:pgMap,community:pgCommunity,bot:pgBot})[page](P);}
const cityChips=()=>`<div class="row" style="margin-bottom:.8rem">${Object.keys(CITIES).map(c=>`<button class="chip ${c===city?'on':''}" onclick="city='${c}';render()">${CITIES[c].n}</button>`).join('')}</div>`;

/* ===== الصفحات ===== */
function pgHome(P){const C=CITIES[city];
 P.innerHTML=`<div class="hero"><h2>مرحباً ${session.name}!</h2><p>إلى أين تريد الذهاب اليوم؟</p>
  <div class="search"><input class="inp" id="q" placeholder="ابحث عن مدينة..."><button class="btn" onclick="doSearch()">${ic('nav',16)}</button></div></div>
  <div class="cats">
   <button class="cat" onclick="tab='hotels';go('explore')"><span class="ci">${ic('hotel')}</span>الفنادق</button>
   <button class="cat" onclick="tab='rest';go('explore')"><span class="ci">${ic('food')}</span>المطاعم</button>
   <button class="cat" onclick="tab='spots';go('explore')"><span class="ci">${ic('pin')}</span>الأماكن</button>
   <button class="cat" onclick="go('trip')"><span class="ci">${ic('cal')}</span>رحلاتي</button>
  </div>
  <div class="sec">وجهات مقترحة</div>
  ${Object.keys(CITIES).slice(0,4).map(c=>`<div class="dest"><div class="ph">${ic('pin',22)}</div><div style="flex:1"><b>${CITIES[c].n} — ${CITIES[c].c}</b><small>${CITIES[c].spots.length} أماكن سياحية • ${CITIES[c].hotels.length} فنادق</small></div><button class="btn sm" onclick="city='${c}';go('explore')">اكتشف</button></div>`).join('')}
  <div class="sec">مجتمع المسافرين</div>
  <div class="card" style="display:flex;gap:.7rem;align-items:center">${ic('cam',26)}<div style="flex:1;font-size:.78rem;color:var(--muted)">شارك صورة من رحلتك الأخيرة مع باقي المسافرين</div><button class="btn sm navy" onclick="go('community')">شارك الآن</button></div>`;}
function doSearch(){const q=$('q').value.trim();const k=Object.keys(CITIES).find(c=>CITIES[c].n.includes(q)||CITIES[c].c.includes(q));if(k)city=k;go('explore');}

function pgTrip(P){let t=lg('sb_trip',null);
 if(!t){P.innerHTML=`<div class="sec">تخطيط رحلة جديدة</div>
  <div class="card"><label>الوجهة<select class="inp" id="tCity">${Object.keys(CITIES).map(c=>`<option value="${c}">${CITIES[c].n}</option>`).join('')}</select></label>
  <label>تاريخ الذهاب<input class="inp" type="date" id="tFrom" value="2026-09-01"></label>
  <label>تاريخ العودة<input class="inp" type="date" id="tTo" value="2026-09-03"></label>
  <button class="btn w" onclick="mkTrip()">${ic('plane',16)} إنشاء خطة الرحلة</button></div>`;return;}
 const days=Math.min(7,Math.max(1,Math.round((new Date(t.to)-new Date(t.from))/864e5)+1));
 while(t.days.length<days)t.days.push([]);
 P.innerHTML=`<div class="hero" style="display:flex;justify-content:space-between;align-items:center"><div><h2>رحلتك إلى ${CITIES[t.city].n}</h2><p>${t.from} ← ${t.to} • ${days} أيام</p></div><button class="btn sm ghost" onclick="if(confirm('حذف الرحلة؟')){ls('sb_trip',null);render()}">${ic('trash',15)}</button></div>
  <div class="sec">خطة الرحلة</div>
  ${Array.from({length:days},(_,d)=>`<div class="day-h">اليوم ${d+1}</div><div class="timeline">
   ${t.days[d].map((it,ix)=>`<div class="tl"><button class="del" onclick="delItem(${d},${ix})">${ic('trash',13)}</button><b>${it.title}</b><small>${it.time} • ${it.type}</small></div>`).join('')||'<small style="color:var(--muted)">لا أنشطة بعد</small>'}
  </div>`).join('')}
  <div class="card"><div class="sec" style="margin-top:0">إضافة نشاط</div>
   <div class="grid2"><label>اليوم<select class="inp" id="iDay">${Array.from({length:days},(_,d)=>`<option value="${d}">اليوم ${d+1}</option>`).join('')}</select></label>
   <label>الوقت<input class="inp" type="time" id="iTime" value="10:00"></label></div>
   <label>النشاط<input class="inp" id="iTitle" placeholder="مثال: زيارة آيا صوفيا"></label>
   <label>النوع<select class="inp" id="iType"><option>تنقل</option><option>معلم سياحي</option><option>مطعم</option><option>فندق</option><option>تسوق</option></select></label>
   <button class="btn w" onclick="addItem()">${ic('plus',16)} إضافة</button></div>
  <div class="sec">قائمة الحاجيات</div>
  <div class="card"><div class="prog"><i style="width:${Math.round(t.check.filter(c=>c.done).length/t.check.length*100)}%"></i></div>
   ${t.check.map((c,ix)=>`<div class="check"><input type="checkbox" ${c.done?'checked':''} onchange="togCheck(${ix})"><span class="${c.done?'done':''}">${c.t}</span></div>`).join('')}
   <div style="display:flex;gap:.4rem;margin-top:.7rem"><input class="inp" id="newCh" placeholder="حاجة جديدة..."><button class="btn sm" onclick="addCheck()">${ic('plus',14)}</button></div></div>`;}
function mkTrip(){const from=$('tFrom').value,to=$('tTo').value;
 if(new Date(to)<new Date(from)){alert('تاريخ العودة قبل الذهاب!');return;}
 ls('sb_trip',{city:$('tCity').value,from,to,days:[],check:['جواز السفر','تذاكر السفر','حجز الفندق','تأمين السفر','شاحن الهاتف','أدوية شخصية'].map(t=>({t,done:false}))});render();}
function addItem(){const t=lg('sb_trip',null);const title=$('iTitle').value.trim();if(!title)return;
 t.days[+$('iDay').value].push({title,time:$('iTime').value,type:$('iType').value});ls('sb_trip',t);render();}
function delItem(d,ix){const t=lg('sb_trip',null);t.days[d].splice(ix,1);ls('sb_trip',t);render();}
function togCheck(ix){const t=lg('sb_trip',null);t.check[ix].done=!t.check[ix].done;ls('sb_trip',t);render();}
function addCheck(){const v=$('newCh').value.trim();if(!v)return;const t=lg('sb_trip',null);t.check.push({t:v,done:false});ls('sb_trip',t);render();}

function pgExplore(P){const C=CITIES[city];
 const lists={hotels:C.hotels.map(h=>`<div class="item"><div class="ic">${ic('hotel',20)}</div><div><b>${h.n}</b><span class="stars">★ ${h.r}</span></div><div class="end"><div class="price">$${h.p}</div><small>لليلة</small></div></div>`).join(''),
 rest:C.rest.map(r=>`<div class="item"><div class="ic">${ic('food',20)}</div><div><b>${r.n}</b><small>${r.t}</small></div><div class="end"><a class="btn sm ghost" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(r.n+' '+C.n)}">اتجاهات</a></div></div>`).join(''),
 spots:C.spots.map(s=>`<div class="item"><div class="ic">${ic('pin',20)}</div><div><b>${s.n}</b><small>${s.d}</small></div><div class="end"><a class="btn sm ghost" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.n+' '+C.n)}">اتجاهات</a></div></div>`).join('')};
 P.innerHTML=`<div class="sec">استكشف ${C.n}</div>${cityChips()}
  <div class="row" style="margin-bottom:.8rem">
   <button class="chip ${tab==='hotels'?'on':''}" onclick="tab='hotels';render()">الفنادق</button>
   <button class="chip ${tab==='rest'?'on':''}" onclick="tab='rest';render()">المطاعم</button>
   <button class="chip ${tab==='spots'?'on':''}" onclick="tab='spots';render()">الأماكن السياحية</button>
  </div>${lists[tab]}`;}

function pgMap(P){const C=CITIES[city];
 P.innerHTML=`<div class="sec">الخريطة — ${C.n}</div>${cityChips()}
  <iframe class="map" src="https://www.openstreetmap.org/export/embed.html?bbox=${C.lon-.08}%2C${C.lat-.05}%2C${C.lon+.08}%2C${C.lat+.05}&layer=mapnik&marker=${C.lat}%2C${C.lon}"></iframe>
  <div style="margin:.6rem 0"><a class="btn sm navy" target="_blank" href="https://www.google.com/maps/@${C.lat},${C.lon},13z">فتح في خرائط جوجل</a></div>
  <div class="tools">
   <div class="card wth" style="margin:0"><div class="sec" style="margin:0 0 .4rem">الطقس الآن</div><div id="wBox" style="font-size:.75rem;color:var(--muted)">جارِ التحميل...</div></div>
   <div class="card" style="margin:0"><div class="sec" style="margin:0 0 .4rem">تحويل العملات</div>
    <input class="inp" type="number" id="cvA" value="100" oninput="doCv()" style="margin-bottom:.4rem">
    <div class="grid2"><select class="inp" id="cvF" onchange="doCv()">${Object.keys(RATES).map(r=>`<option ${r==='MAD'?'selected':''}>${r}</option>`).join('')}</select>
    <select class="inp" id="cvT" onchange="doCv()">${Object.keys(RATES).map(r=>`<option ${r==='TRY'?'selected':''}>${r}</option>`).join('')}</select></div>
    <div id="cvR" style="font-weight:900;color:var(--blue);margin-top:.4rem;font-size:.9rem"></div>
    <small style="color:var(--muted);font-size:.6rem">أسعار تقريبية</small></div>
  </div>`;
 doCv();
 fetch(`https://api.open-meteo.com/v1/forecast?latitude=${C.lat}&longitude=${C.lon}&current=temperature_2m,weather_code,wind_speed_10m`)
  .then(r=>r.json()).then(j=>{const w=j.current;$('wBox').innerHTML=`<b>${Math.round(w.temperature_2m)}°</b> ${wtxt(w.weather_code)}<br>الرياح: ${Math.round(w.wind_speed_10m)} كم/س`;})
  .catch(()=>{$('wBox').textContent='تعذر الاتصال بخدمة الطقس';});}
function wtxt(c){return c===0?'صحو':c<3?'غائم جزئياً':c<45?'غائم':c<50?'ضباب':c<70?'أمطار':c<85?'ثلوج':'عاصفة';}
function doCv(){const a=+$('cvA').value||0,f=$('cvF').value,t=$('cvT').value;
 $('cvR').textContent=(a/RATES[f]*RATES[t]).toFixed(2)+' '+t;}

function pgCommunity(P){const posts=lg('sb_posts',[]);
 P.innerHTML=`<div class="sec">مجتمع المسافرين</div>
  <p style="font-size:.75rem;color:var(--muted);margin-bottom:.7rem">شارك صورة من رحلاتك مع باقي الأعضاء — مجانا وبدون حدود.</p>
  <div class="card"><label>صورة من رحلتك<input type="file" accept="image/*" id="pFile" style="font-size:.75rem"></label>
  <label>وصف الصورة<input class="inp" id="pCap" placeholder="مثال: غروب رائع في إسطنبول..."></label>
  <button class="btn w" onclick="addPost()">${ic('cam',16)} نشر المشاركة</button></div>
  ${[...posts].reverse().map((p,ri)=>{const ix=posts.length-1-ri;return `<div class="post">${p.img?`<img src="${p.img}">`:`<div class="noimg">${ic('cam',30)}</div>`}
   <div class="pb"><p>${p.cap||''}</p><div class="pm"><span>${ic('user',12)} ${p.by}</span>
   <button class="like" onclick="likePost(${ix})">${ic('heart',14)} ${p.likes||0}</button></div></div></div>`;}).join('')||'<div class="card" style="text-align:center;color:var(--muted);font-size:.78rem">كن أول من يشارك صورة!</div>'}`;}
function addPost(){const f=$('pFile').files[0],cap=$('pCap').value.trim();
 if(!f&&!cap){alert('أضف صورة أو وصفا على الأقل.');return;}
 const save=img=>{const posts=lg('sb_posts',[]);posts.push({img,cap,by:session.name,likes:0});
  try{ls('sb_posts',posts);}catch(e){alert('مساحة التخزين ممتلئة — احذف بعض المشاركات القديمة.');return;}
  render();};
 if(f){const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');const s=Math.min(1,600/Math.max(img.width,img.height));c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);save(c.toDataURL('image/jpeg',.7));};img.src=r.result;};r.readAsDataURL(f);}else save(null);}
function likePost(ix){const p=lg('sb_posts',[]);p[ix].likes=(p[ix].likes||0)+1;ls('sb_posts',p);render();}

function pgBot(P){P.innerHTML=`<div class="sec">المساعد الذكي</div>
  <div class="chat" id="chatBox">${chat.map(m=>`<div class="msg ${m.who}">${m.txt}</div>`).join('')||`<div class="msg bot">مرحباً ${session.name}! أنا سندباد، مساعدك الذكي للسفر. كيف يمكنني مساعدتك اليوم؟</div>`}</div>
  <div class="sugs">${['أفضل فنادق إسطنبول','اقترح مطاعم في '+CITIES[city].n,'ما هي الأماكن السياحية؟','كيف أحول العملات؟'].map(s=>`<button class="chip" onclick="ask('${s}')">${s}</button>`).join('')}</div>
  <div style="display:flex;gap:.4rem"><input class="inp" id="bIn" placeholder="اكتب رسالتك هنا..." onkeydown="if(event.key==='Enter')ask()"><button class="btn" onclick="ask()">${ic('send',16)}</button></div>`;
 const cb=$('chatBox');cb.scrollTop=cb.scrollHeight;}
function ask(q){const txt=q||$('bIn').value.trim();if(!txt)return;
 chat.push({who:'me',txt});const C=CITIES[city];let a='';
 if(txt.includes('فندق'))a='أفضل الفنادق في '+C.n+':\n'+C.hotels.map(h=>`• ${h.n} — $${h.p}/ليلة (★${h.r})`).join('\n');
 else if(txt.includes('مطعم')||txt.includes('أكل')||txt.includes('اكل'))a='مطاعم مقترحة في '+C.n+':\n'+C.rest.map(r=>`• ${r.n} — ${r.t}`).join('\n');
 else if(txt.includes('مكان')||txt.includes('معالم')||txt.includes('نزور')||txt.includes('سياح'))a='أهم المعالم في '+C.n+':\n'+C.spots.map(s=>`• ${s.n}: ${s.d}`).join('\n');
 else if(txt.includes('عمل')||txt.includes('درهم')||txt.includes('دولار'))a='تقدر تحول العملات من صفحة الخريطة — أداة تحويل العملات تعطيك السعر التقريبي فورا.';
 else if(txt.includes('طقس'))a='تقدر تشوف الطقس الحالي لأي مدينة من صفحة الخريطة.';
 else if(txt.includes('مرحبا')||txt.includes('سلام'))a='أهلا وسهلا! أنا هنا لمساعدتك في تخطيط رحلتك خطوة بخطوة.';
 else a='نصيحتي لك: ابدأ بإنشاء خطة رحلتك من صفحة "رحلتي"، وسأقترح عليك الفنادق والمعالم والمطاعم في وجهتك. هل تريد معرفة المزيد عن '+C.n+'؟';
 chat.push({who:'bot',txt:a});render();}

render();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}
</script>
</body>
</html>
